<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麒麟 · 个人知识库</title>
  <meta name="description" content="记录 · 整理 · 沉淀，让每一份技术积累都可被检索。">
  <meta name="keywords" content="知识库,个人作品,技术博客,Kubernetes,DevOps,Linux,网络,数据库">
  <meta name="author" content="麒麟君">
  <meta property="og:type" content="website">
  <meta property="og:title" content="麒麟 · 个人知识库">
  <meta property="og:description" content="记录 · 整理 · 沉淀，让每一份技术积累都可被检索。">
  <meta name="theme-color" content="#4f6ef7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f6ef7'/%3E%3Ctext x='32' y='44' font-size='36' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3E%E9%BA%92%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 阅读进度条 -->
  <div class="progress-bar" id="progressBar" aria-hidden="true"></div>

  <!-- 顶部导航 -->
  <header class="header" id="header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><path d="M7 8.5 16 4l9 4.5v15L16 28l-9-4.5v-15Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7 8.5 16 13l9-4.5M16 13v15" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-text">
          <strong>麒麟</strong>
          <small>QILIN</small>
        </span>
      </a>

      <nav class="nav" id="nav" aria-label="主导航">
        <a href="#/" data-route="/">首页</a>
        <a href="#/knowledge" data-route="/knowledge">知识库</a>
        <a href="#/journal" data-route="/journal">日记</a>
        <a href="#/works" data-route="/works">作品</a>
        <a href="#/archives" data-route="/archives">归档</a>
        <a href="#/tags" data-route="/tags">标签</a>
        <a href="#/about" data-route="/about">关于</a>
      </nav>

      <div class="header-actions">
        <button class="icon-btn search-btn" id="searchBtn" type="button" aria-label="搜索" title="搜索 (Ctrl+K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="切换主题" title="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <a class="icon-btn github-btn" href="https://github.com/yourname" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.57.1.78-.25.78-.55v-2.1c-3.18.69-3.85-1.35-3.85-1.35-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.75 1.18 1.75 1.18 1.02 1.75 2.68 1.25 3.33.95.1-.74.4-1.25.72-1.54-2.55-.29-5.23-1.27-5.23-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.04 0 0 .96-.3 3.16 1.17a10.9 10.9 0 0 1 5.76 0c2.2-1.47 3.15-1.17 3.15-1.17.63 1.58.24 2.75.12 3.04.73.8 1.18 1.82 1.18 3.07 0 4.4-2.69 5.37-5.25 5.65.41.36.78 1.06.78 2.14v3.17c0 .3.2.66.79.55A11.5 11.5 0 0 0 12 .5Z"/></svg>
        </a>
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开菜单" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 页面内容由 JS 渲染 -->
  <main id="app" tabindex="-1"></main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-brand">
          <div class="footer-logo">麒麟 <span>Qilin</span></div>
          <p>把踩过的坑写成路标，让知识可以被复用。</p>
          <div class="footer-socials" id="footerSocials"></div>
        </div>
        <div class="footer-links">
          <div>
            <h4>导航</h4>
            <a href="#/">首页</a>
            <a href="#/knowledge">知识库</a>
            <a href="#/journal">日记</a>
            <a href="#/works">个人作品</a>
            <a href="#/archives">归档</a>
            <a href="#/tags">标签</a>
          </div>
          <div>
            <h4>关于</h4>
            <a href="#/about">关于我</a>
            <a href="mailto:hello@example.com">联系我</a>
            <a href="https://github.com/yourname" target="_blank" rel="noopener">GitHub</a>
          </div>
          <div>
            <h4>友情链接</h4>
            <a href="https://hexo.io/" target="_blank" rel="noopener">Hexo</a>
            <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a>
            <a href="https://developer.mozilla.org/zh-CN/" target="_blank" rel="noopener">MDN</a>
          </div>
        </div>
      </div>
      <div class="footer-bottom">
        <span>© <span id="year"></span> 麒麟 · 由 GitHub Pages 强力驱动</span>
        <div class="visit-stats" title="访问统计由 Abacus 提供，离线时使用本机记录">
          <span class="visit-item"><i>📅</i> 今日访问 <b class="visit-count" data-visit="today">—</b></span>
          <span class="visit-sep"></span>
          <span class="visit-item"><i>📈</i> 历史访问 <b class="visit-count" data-visit="total">—</b></span>
        </div>
        <span>Made with care &amp; curiosity</span>
      </div>
    </div>
  </footer>

  <!-- 返回顶部 -->
  <button class="back-to-top" id="backToTop" type="button" aria-label="返回顶部" title="返回顶部">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg>
  </button>

  <!-- 搜索弹层 -->
  <div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="站内搜索" hidden>
    <div class="search-modal">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="text" placeholder="搜索文章标题、摘要、标签或正文..." autocomplete="off" spellcheck="false">
        <kbd>ESC</kbd>
      </div>
      <div class="search-hint" id="searchHint">输入关键词开始搜索，支持标题、标签与正文匹配</div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
